services:
  db:
    image: mysql:8.0
    restart: "no"
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: meinedb
      MYSQL_USER: springuser
      MYSQL_PASSWORD: springpass
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    # build: .  # use image for deployment and build: . for local testing
    image: ghcr.io/SE2-Cluedo-2026/Server:latest
    restart: unless-stopped
    ports:
      - "53211:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/meinedb?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: springuser
      SPRING_DATASOURCE_PASSWORD: springpass
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  mysql_data: